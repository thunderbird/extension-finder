<!DOCTYPE html>
<html>
  <head>
    <title>Extension Finder</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <section>
      <h1 data-i18n-content="pageTitle"></h1>
      <p id="pageTitleVersionInfo" hidden><span id="versionInfoMain"></span> <span id="versionInstalledInfo" hidden></span></p>
      <input id="extensionFinderSearchInput" class="search" disabled
        data-i18n-placeholder="inputPlaceholderLoading">
      <datalist id="addon-suggestions"></datalist>
      <ul class="out">
        <template id="search-result-addon">
          <li>
            <div class="legacy">
              <b class="legacy-name"></b>
              <span data-i18n-content="suggestedAlternative"></span>
            </div>
            <div class="alternative">
              <img class="icon">
              <div class="info">
                <h3 class="alt-name"></h3>
                <p class="alt-desc"></p>
                <div class="byline"><span data-i18n-content="byAuthor"></span> <span class="alt-author"></span></div>
              </div>
              <div class="cta">
                <a class="button" data-i18n-content="learnMore"></a>
                <div class="compat-info"></div>
              </div>
            </div>
            <details class="experiment-info">
              <summary data-i18n-content="experimentInfoSummary"></summary>
              <p data-i18n-content="experimentInfoBody"></p>
              <p data-i18n-content="experimentInfoBodyESRvsRelease"></p>
              <p><a class="experiment-info-link" data-i18n-content="experimentInfoLearnMore"></a> · <a class="experiment-info-download" data-i18n-content="experimentInfoDownloadESR"></a></p>
            </details>
          </li>
        </template>
        <template id="search-result-general">
          <li>
            <div class="legacy">
              <b class="legacy-name"></b>
              <span data-i18n-content="suggestedAlternative"></span>
            </div>
            <div class="alternative noslug">
              <div class="info">
                <h3 class="alt-name"></h3>
                <div class="alt-desc"></div>
              </div>
              <div class="cta">
                <a class="button" data-i18n-content="learnMore"></a>
              </div>
            </div>
          </li>
        </template>
        <template id="search-result-empty">
          <li class="noresults">
            <h2 data-i18n-content="noAlternativesFound"></h2>
          </li>
        </template>
        <template id="search-result-compat">
          <li>
            <div class="note">
              <span data-i18n-content="noteCompat"></span>
              <span class="compatVersion"></span>.
            </div>
            <div class="alternative">
              <img class="icon">
              <div class="info">
                <h3 class="alt-name"></h3>
                <p class="alt-desc"></p>
                <div class="byline"><span data-i18n-content="byAuthor"></span> <span class="alt-author"></span></div>
              </div>
              <div class="cta">
                <a class="button" data-i18n-content="showAddOn"></a>
                <div class="compat-info"></div>
              </div>
            </div>
            <details class="experiment-info">
              <summary data-i18n-content="experimentInfoSummary"></summary>
              <p data-i18n-content="experimentInfoBody"></p>
              <p data-i18n-content="experimentInfoBodyESRvsRelease"></p>
              <p><a class="experiment-info-link" data-i18n-content="experimentInfoLearnMore"></a> · <a class="experiment-info-download" data-i18n-content="experimentInfoDownloadESR"></a></p>
            </details>
            <details class="help">
              <summary data-i18n-content="helpSummary"></summary>
              <p data-i18n-content="helpBody1"></p>
              <p data-i18n-content="helpBody2"></p>
              <img src="update-addons.png"/>
            </details>
          </li>
        </template>
        <template id="search-result-notyetcompat">
          <li>
            <div class="note" data-i18n-content="noteNotyetcompat"></div>
            <div class="alternative">
              <img class="icon">
              <div class="info">
                <h3 class="alt-name"></h3>
                <p class="alt-desc"></p>
                <div class="byline"><span data-i18n-content="byAuthor"></span> <span class="alt-author"></span></div>
              </div>
              <div class="cta">
                <a class="button" data-i18n-content="showAddOn"></a>
                <div class="compat-info"></div>
              </div>
            </div>
            <details class="experiment-info">
              <summary data-i18n-content="experimentInfoSummary"></summary>
              <p data-i18n-content="experimentInfoBody"></p>
              <p data-i18n-content="experimentInfoBodyESRvsRelease"></p>
              <p><a class="experiment-info-link" data-i18n-content="experimentInfoLearnMore"></a> · <a class="experiment-info-download" data-i18n-content="experimentInfoDownloadESR"></a></p>
            </details>
          </li>
        </template>
        <template id="search-result-notfullycompat">
          <li>
            <div class="note">
              <span data-i18n-content="noteNotfullycompat"></span>
              <span class="compatVersion"></span>.
            </div>
            <div class="alternative">
              <img class="icon">
              <div class="info">
                <h3 class="alt-name"></h3>
                <p class="alt-desc"></p>
                <div class="byline"><span data-i18n-content="byAuthor"></span> <span class="alt-author"></span></div>
              </div>
              <div class="cta">
                <a class="button" data-i18n-content="showAddOn"></a>
                <div class="compat-info"></div>
              </div>
            </div>
            <details class="experiment-info">
              <summary data-i18n-content="experimentInfoSummary"></summary>
              <p data-i18n-content="experimentInfoBody"></p>
              <p data-i18n-content="experimentInfoBodyESRvsRelease"></p>
              <p><a class="experiment-info-link" data-i18n-content="experimentInfoLearnMore"></a> · <a class="experiment-info-download" data-i18n-content="experimentInfoDownloadESR"></a></p>
            </details>
          </li>
        </template>
      </ul>
    </section>
    <script src="lunr.min.js"></script>
    <script src="script.js" type="module"></script>
  </body>
</html>
