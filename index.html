<!DOCTYPE html>
<html>
  <head>
    <title>Extension Finder</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <section>
      <h1>
        Find alternatives for extensions incompatible with the most recent version of Thunderbird.
      </h1>
      <input id="extensionFinderSearchInput" class="search" disabled placeholder="loading data...">
      <datalist id="addon-suggestions"></datalist>
      <div class="smallprint" id="replacementsListIntro" hidden="true">
        <p>The following are recommended replacements for extensions that may not work in the most recent version of Thunderbird.</p>
      </div>
      <ul class="out">
        <template id="search-result-addon">
          <li>
            <div class="legacy">
              <b class="legacy-name"></b>
              suggested alternative:
            </div>
            <div class="alternative">
              <img class="icon">
              <div class="info">
                <h3 class="alt-name"></h3>
                <p class="alt-desc"></p>
                <div class="byline">by <span class="alt-author"></span></div>
                <div class="compat-info byline"></div>
              </div>
              <div class="cta">
                <a class="button">Learn More</a>
              </div>
            </div>
          </li>
        </template>
        <template id="search-result-general">
          <li>
            <div class="legacy">
              <b class="legacy-name"></b>
              suggested alternative:
            </div>
            <div class="alternative noslug">
              <div class="info">
                <h3 class="alt-name"></h3>
                <div class="alt-desc"></div>
              </div>
              <div class="cta">
                <a class="button">Learn More</a>
              </div>
            </div>
          </li>
        </template>
        <template id="search-result-empty">
          <li class="noresults">
            <h2>
              No alternatives found.
            </h2>
          </li>
        </template>
        <template id="search-result-compat">
          <li>
            <div class="note">
              The add-on seems to be maintained and is compatible with <span class="compatVersion"></span>.
            </div>
            <div class="alternative">
              <img class="icon">
              <div class="info">
                <h3 class="alt-name"></h3>
                <p class="alt-desc"></p>
                <div class="byline">by <span class="alt-author"></span></div>
                <div class="compat-info byline"></div>
              </div>
              <div class="cta">
                <a class="button">Show Add-on</a>
              </div>
            </div>
            <details class="help">
              <summary>Still showing as incompatible?</summary>
              <p>Directly after updating Thunderbird, it is possible that the add-on is still marked as incompatible. Either the add-on manager did not update the displayed information after the automatic add-on update (re-opening the add-on manger should fix that), or the automatic update check failed due to a connection timeout to addons.thunderbird.net.</p>
              <p>Manually search for add-on updates by clicking on the gear menu in the add-on manager as shown below.</p>
              <img src="update-addons.png"/>
            </details>
          </li>
        </template>
        <template id="search-result-notyetcompat">
          <li>
            <div class="note">
              The add-on seems to be maintained, but a compatible version has not yet been released.
            </div>
            <div class="alternative">
              <img class="icon">
              <div class="info">
                <h3 class="alt-name"></h3>
                <p class="alt-desc"></p>
                <div class="byline">by <span class="alt-author"></span></div>
                <div class="compat-info byline"></div>
              </div>
              <div class="cta">
                <a class="button">Show Add-on</a>
              </div>
            </div>
          </li>
        </template>
        <template id="search-result-notfullycompat">
          <li>
            <div class="note">
              The add-on seems to be maintained, but requires <span class="compatVersion"></span>.
            </div>
            <div class="alternative">
              <img class="icon">
              <div class="info">
                <h3 class="alt-name"></h3>
                <p class="alt-desc"></p>
                <div class="byline">by <span class="alt-author"></span></div>
                <div class="compat-info byline"></div>
              </div>
              <div class="cta">
                <a class="button">Show Add-on</a>
              </div>
            </div>
          </li>
        </template>
      </ul>
    </section>
    <script src="lunr.min.js"></script>
    <script src="script.js" type="module"></script>
  </body>
</html>
